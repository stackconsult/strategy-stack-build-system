<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>19-Agent Build System Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .header p {
            color: #666;
            font-size: 14px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .stat-card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .stat-card .value {
            color: #333;
            font-size: 36px;
            font-weight: bold;
        }
        .builds-section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .builds-section h2 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .build-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        .build-card.complete {
            border-left-color: #10b981;
        }
        .build-card.running {
            border-left-color: #f59e0b;
        }
        .build-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .build-id {
            font-weight: bold;
            color: #333;
            font-size: 16px;
        }
        .build-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .build-status.complete {
            background: #d1fae5;
            color: #065f46;
        }
        .build-status.running {
            background: #fef3c7;
            color: #92400e;
        }
        .build-details {
            color: #666;
            font-size: 14px;
        }
        .gates-list {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 10px;
        }
        .gate-badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            background: #e5e7eb;
            color: #374151;
        }
        .gate-badge.passed {
            background: #d1fae5;
            color: #065f46;
        }
        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 20px;
        }
        .refresh-btn:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>19-Agent Build System Dashboard</h1>
            <p>Real-time build monitoring and status tracking</p>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Builds</h3>
                <div class="value" id="total-builds">-</div>
            </div>
            <div class="stat-card">
                <h3>Completed</h3>
                <div class="value" id="completed-builds">-</div>
            </div>
            <div class="stat-card">
                <h3>Total Gates</h3>
                <div class="value" id="total-gates">-</div>
            </div>
            <div class="stat-card">
                <h3>Gates Passed</h3>
                <div class="value" id="passed-gates">-</div>
            </div>
        </div>
        
        <div class="builds-section">
            <h2>Recent Builds</h2>
            <div id="builds-list">
                <p>Loading...</p>
            </div>
            <button class="refresh-btn" onclick="loadData()">Refresh</button>
        </div>
    </div>
    
    <script>
        async function loadData() {
            try {
                // Load stats
                const statsRes = await fetch('/api/stats');
                const stats = await statsRes.json();
                document.getElementById('total-builds').textContent = stats.total_builds;
                document.getElementById('completed-builds').textContent = stats.completed_builds;
                document.getElementById('total-gates').textContent = stats.total_gates;
                document.getElementById('passed-gates').textContent = stats.passed_gates;
                
                // Load builds
                const buildsRes = await fetch('/api/builds');
                const builds = await buildsRes.json();
                
                const buildsList = document.getElementById('builds-list');
                if (builds.length === 0) {
                    buildsList.innerHTML = '<p>No builds found</p>';
                    return;
                }
                
                buildsList.innerHTML = builds.map(build => `
                    <div class="build-card ${build.status.toLowerCase()}">
                        <div class="build-header">
                            <span class="build-id">${build.build_id}</span>
                            <span class="build-status ${build.status.toLowerCase()}">${build.status}</span>
                        </div>
                        <div class="build-details">
                            Phase: ${build.current_phase} | 
                            Created: ${new Date(build.created_at).toLocaleString()}
                            ${build.completed_at ? ` | Completed: ${new Date(build.completed_at).toLocaleString()}` : ''}
                        </div>
                    </div>
                `).join('');
                
                // Load gates for first build
                if (builds.length > 0) {
                    const gatesRes = await fetch(`/api/builds/${builds[0].build_id}/gates`);
                    const gates = await gatesRes.json();
                    
                    const firstCard = buildsList.querySelector('.build-card');
                    if (firstCard) {
                        const gatesList = document.createElement('div');
                        gatesList.className = 'gates-list';
                        gatesList.innerHTML = gates.map(gate => `
                            <span class="gate-badge ${gate.status === 'PASSED' ? 'passed' : ''}">${gate.gate_id}</span>
                        `).join('');
                        firstCard.appendChild(gatesList);
                    }
                }
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }
        
        // Load data on page load
        loadData();
        
        // Auto-refresh every 10 seconds
        setInterval(loadData, 10000);
    </script>
</body>
</html>
